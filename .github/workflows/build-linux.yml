name: Build Linux (Debian 12 container)

# Build inside a debian:12 container so glibc matches the target server exactly
# (Debian 12 / glibc 2.36). ubuntu-latest gives a much newer glibc, and a binary
# built there dies on Debian 12 with "GLIBC_2.xx not found".

on:
  workflow_dispatch:
  push:
    branches: [ master ]

permissions:
  contents: read

concurrency:
  group: kuni-linux-build
  cancel-in-progress: true

jobs:
  build:
    name: kuni-linux-x86_64
    runs-on: ubuntu-latest
    container:
      image: debian:12

    env:
      DEBIAN_FRONTEND: noninteractive
      GIT_SUBMODULE_STRATEGY: recursive

    defaults:
      run:
        # GitHub Actions defaults to `sh -e {0}`, and on debian:12 /bin/sh is dash,
        # which has no `set -o pipefail` -> "Illegal option -o pipefail".
        shell: bash

    steps:
      - name: Install build deps
        # Must be first: debian:12 ships no git/python3/cmake.
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl wget gnupg git \
            python3 build-essential cmake ninja-build pkg-config gperf \
            zlib1g-dev libssl-dev libcrypt-dev libcurl4-openssl-dev \
            libglew-dev libdbus-1-dev libfontconfig-dev libpulse-dev \
            libgtk-4-dev libadwaita-1-dev \
            binutils file software-properties-common

      - name: Install Clang >= 20
        # CMakeLists hard-fails below GCC 15 / Clang 20, and Debian 12 only ships
        # GCC 12. Add the LLVM apt repo by hand (apt.llvm.org's llvm.sh needs
        # add-apt-repository and aborts without it), then take the newest
        # version the distro actually has instead of hard-pinning one.
        run: |
          set -uo pipefail
          wget -qO /tmp/llvm.key https://apt.llvm.org/llvm-snapshot.gpg.key
          gpg --dearmor -o /usr/share/keyrings/llvm-archive-keyring.gpg /tmp/llvm.key
          for V in 22 21 20; do
            echo "deb [signed-by=/usr/share/keyrings/llvm-archive-keyring.gpg] http://apt.llvm.org/bookworm/ llvm-toolchain-bookworm-${V} main" \
              > /etc/apt/sources.list.d/llvm${V}.list
          done
          apt-get update
          PICKED=""
          for V in 22 21 20; do
            if apt-get install -y --no-install-recommends clang-${V} lld-${V}; then
              PICKED="$V"
              break
            fi
            echo "clang-${V} unavailable for bookworm, trying older"
          done
          [ -n "$PICKED" ] || { echo "ERROR: no clang >= 20 available"; exit 1; }
          echo "CC=clang-${PICKED}"    >> "$GITHUB_ENV"
          echo "CXX=clang++-${PICKED}" >> "$GITHUB_ENV"
          echo "PICKED=clang-${PICKED}"

          # tdlib links against the compiler-rt sanitizer runtimes. Without
          # libclang-rt-XX-dev the driver looks in the upstream triple path
          # (.../lib/x86_64-pc-linux-gnu/) while Debian ships them in
          # (.../lib/linux/*-x86_64.a), and ld fails after ~20 min of compiling.
          for RT in "libclang-rt-${PICKED}-dev" "libclang-common-${PICKED}-dev"; do
            apt-get install -y --no-install-recommends "$RT" || true
          done
          # Prove the runtime actually links - don't just look for a file,
          # Debian's path/name differ from the upstream one clang defaults to.
          echo 'int main(){return 0;}' > /tmp/ubsan_probe.cpp
          if ! clang++-${PICKED} -fsanitize=undefined /tmp/ubsan_probe.cpp -o /tmp/ubsan_probe; then
            echo "ERROR: -fsanitize=undefined link failed; tdlib would not build"
            clang++-${PICKED} -print-resource-dir
            exit 1
          fi
          /tmp/ubsan_probe && echo "ubsan link: OK"
          clang++-${PICKED} --version
          clang++-${PICKED} -dumpversion

      - name: Fetch sources
        uses: actions/checkout@v4

      - name: Patch image_url to OpenAI spec
        # Kuni emits {"type":"image_url","image_url":"<data-url>"} - a bare string.
        # OpenAI-compatible gateways drop the image in that form and the model
        # replies "I can't see the image". Spec requires {"url": "<data-url>"}:
        #   AJson::Object{{"type","image_url"},{"image_url", body}}
        run: |
          python3 - <<'PY'
          p = 'src/IOpenAIChat.cpp'
          s = open(p, encoding='utf-8').read()
          old = 'AJson::Object{{"type", "image_url"}, {"image_url", body}}'
          new = 'AJson::Object{{"type", "image_url"}, {"image_url", AJson::Object{{"url", std::string(body)}}}}'
          if new in s:
              print('already patched')
          elif old in s:
              open(p, 'w', encoding='utf-8').write(s.replace(old, new))
              print('patched OK')
          else:
              print('ERROR: pattern not found - upstream changed IOpenAIChat.cpp')
              raise SystemExit(1)
          PY
          grep -n 'image_url' src/IOpenAIChat.cpp

      - name: Cache AUI.BOOT deps
        uses: actions/cache@v4
        with:
          path: /root/.aui
          key: aui-boot-deb12-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: |
            aui-boot-deb12-

      - name: Configure CMake
        run: |
          echo "### disk before configure:"; df -h / | tail -1
          cmake -G Ninja -B /work/build \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DAUI_INSTALL_RUNTIME_DEPENDENCIES=TRUE \
            -DAUIB_NO_PRECOMPILED=TRUE
          echo "### cmake cache compiler:"; grep -E 'CMAKE_(CXX_)?COMPILER:' /work/build/CMakeCache.txt
          echo "### AUIB_NO_PRECOMPILED (forces every dep to build from source here):"
          grep -E 'AUIB_NO_PRECOMPILED' /work/build/CMakeCache.txt
          echo "### disk after configure:"; df -h / | tail -1

      - name: Build kuni
        run: |
          echo "### disk before build:"; df -h / | tail -1
          cmake --build /work/build --target kuni -j 4
          echo "### disk after build:"; df -h / | tail -1

      - name: Stage bundle
        run: |
          set -u
          mkdir -p /work/bundle
          cp /work/build/bin/kuni /work/bundle/kuni
          chmod +x /work/bundle/kuni
          find /work/build -name '*.so*' -type f ! -path '*/CMakeFiles/*' \
            -exec cp -p {} /work/bundle/ \; 2>/dev/null || true
          strip --strip-unneeded /work/bundle/kuni
          strip --strip-unneeded /work/bundle/*.so* 2>/dev/null || true

          # Hard gate: the server is Debian 12, whose newest symbol version is
          # GLIBC_2.36. AUI.BOOT precompiled packages come from ubuntu-latest
          # (glibc 2.39), so a stray precompiled .a would raise our floor.
          MAXGLIBC=$(objdump -T /work/bundle/kuni | grep -o 'GLIBC_[0-9][0-9.]*' | sort -Vu | tail -1 || true)
          VER=${MAXGLIBC#GLIBC_}
          MM=$(printf '%s' "$VER" | cut -d. -f1,2)
          HIGHEST=$(printf '%s\n%s\n' "${MM:-none}" 2.36 | sort -V | tail -1)
          echo "### binary needs ${MM:-?} (max symbol $MAXGLIBC); server floor is 2.36"
          if [ "$HIGHEST" != "2.36" ]; then
            echo "ERROR: kuni needs glibc ${MM}, newer than Debian 12 (2.36)"
            exit 1
          fi
          echo "### glibc gate: OK (fits Debian 12)"

          {
            echo "### ldd:"
            ldd /work/bundle/kuni 2>/dev/null || true
            echo
            echo "### MISSING (apt-get install these):"
            ldd /work/bundle/kuni 2>/dev/null | grep -i 'not found' || echo "(none)"
            echo
            echo "### max glibc symbol:"
            objdump -T /work/bundle/kuni | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -1 || true
            echo "### build container glibc:"
            ldd --version 2>/dev/null | sed -n '1p'
          } > /work/bundle/ldd.txt
          cat /work/bundle/ldd.txt

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: kuni-debian12
          path: /work/bundle/
          retention-days: 30
