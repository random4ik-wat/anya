name: Build Linux (Debian 12 container)

# Build inside a debian:12 container so glibc matches the target server exactly
# (Debian 12 / glibc 2.36). ubuntu-latest gives a much newer glibc, and a binary
# built there dies on Debian 12 with "GLIBC_2.xx not found".

on:
  workflow_dispatch:
  push:
    branches: [ master ]

permissions:
  contents: read

concurrency:
  group: kuni-linux-build
  cancel-in-progress: true

jobs:
  build:
    name: kuni-linux-x86_64
    runs-on: ubuntu-latest
    container:
      image: debian:12

    env:
      DEBIAN_FRONTEND: noninteractive
      GIT_SUBMODULE_STRATEGY: recursive

    defaults:
      run:
        # GitHub Actions defaults to `sh -e {0}`, and on debian:12 /bin/sh is dash,
        # which has no `set -o pipefail` -> "Illegal option -o pipefail".
        shell: bash

    steps:
      - name: Install build deps
        # Must be first: debian:12 ships no git/python3/cmake.
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl wget gnupg git \
            python3 build-essential cmake ninja-build pkg-config gperf \
            zlib1g-dev libssl-dev libcrypt-dev libcurl4-openssl-dev \
            libglew-dev libdbus-1-dev libfontconfig-dev libpulse-dev \
            libgtk-4-dev libadwaita-1-dev \
            binutils file software-properties-common

      - name: Install Clang >= 20
        # CMakeLists hard-fails below GCC 15 / Clang 20, and Debian 12 only ships
        # GCC 12. Add the LLVM apt repo by hand (apt.llvm.org's llvm.sh needs
        # add-apt-repository and aborts without it), then take the newest
        # version the distro actually has instead of hard-pinning one.
        run: |
          set -uo pipefail
          wget -qO /tmp/llvm.key https://apt.llvm.org/llvm-snapshot.gpg.key
          gpg --dearmor -o /usr/share/keyrings/llvm-archive-keyring.gpg /tmp/llvm.key
          for V in 22 21 20; do
            echo "deb [signed-by=/usr/share/keyrings/llvm-archive-keyring.gpg] http://apt.llvm.org/bookworm/ llvm-toolchain-bookworm-${V} main" \
              > /etc/apt/sources.list.d/llvm${V}.list
          done
          apt-get update
          PICKED=""
          for V in 22 21 20; do
            if apt-get install -y --no-install-recommends clang-${V} lld-${V}; then
              PICKED="$V"
              break
            fi
            echo "clang-${V} unavailable for bookworm, trying older"
          done
          [ -n "$PICKED" ] || { echo "ERROR: no clang >= 20 available"; exit 1; }
          echo "CC=clang-${PICKED}"    >> "$GITHUB_ENV"
          echo "CXX=clang++-${PICKED}" >> "$GITHUB_ENV"
          echo "PICKED=clang-${PICKED}"

          # tdlib links against the compiler-rt sanitizer runtimes. Without
          # libclang-rt-XX-dev the driver looks in the upstream triple path
          # (.../lib/x86_64-pc-linux-gnu/) while Debian ships them in
          # (.../lib/linux/*-x86_64.a), and ld fails after ~20 min of compiling.
          for RT in "libclang-rt-${PICKED}-dev" "libclang-common-${PICKED}-dev"; do
            apt-get install -y --no-install-recommends "$RT" || true
          done
          # Prove the runtime actually links - don't just look for a file,
          # Debian's path/name differ from the upstream one clang defaults to.
          echo 'int main(){return 0;}' > /tmp/ubsan_probe.cpp
          if ! clang++-${PICKED} -fsanitize=undefined /tmp/ubsan_probe.cpp -o /tmp/ubsan_probe; then
            echo "ERROR: -fsanitize=undefined link failed; tdlib would not build"
            clang++-${PICKED} -print-resource-dir
            exit 1
          fi
          /tmp/ubsan_probe && echo "ubsan link: OK"
          clang++-${PICKED} --version
          clang++-${PICKED} -dumpversion

      - name: Fetch sources
        uses: actions/checkout@v4

      - name: "Patch: image_url to OpenAI spec"
        # Kuni emits {"type":"image_url","image_url":"<data-url>"} - a bare string.
        # OpenAI-compatible gateways drop the image in that form and the model
        # replies "I can't see the image". Spec requires {"url": "<data-url>"}:
        #   AJson::Object{{"type","image_url"},{"image_url", body}}
        # Without this, capabilities.vision is broken end to end.
        run: |
          set -e
          python3 - <<'PY'
          p = 'src/IOpenAIChat.cpp'
          s = open(p, encoding='utf-8').read()
          old = 'AJson::Object{{"type", "image_url"}, {"image_url", body}}'
          new = 'AJson::Object{{"type", "image_url"}, {"image_url", AJson::Object{{"url", std::string(body)}}}}'
          if new in s:
              print('already patched')
          elif old in s:
              open(p, 'w', encoding='utf-8').write(s.replace(old, new))
              print('patched OK')
          else:
              print('ERROR: pattern not found - upstream changed IOpenAIChat.cpp')
              raise SystemExit(1)
          PY
          grep -n 'image_url' src/IOpenAIChat.cpp

      - name: "Patch: log TDLib errors"
        # Kuni discards every td_api::error, so an auth failure produces no log
        # line at all and is impossible to diagnose. Surface them.
        # NOTE: patterns use \n escapes on purpose - literal indentation would
        # be stripped by the YAML block scalar and never match.
        run: |
          set -e
          python3 - <<'PY'
          p = 'src/telegram/TelegramClientImpl.cpp'
          s = open(p, encoding='utf-8').read()
          old = '    ALOG_TRACE(LOG_TAG) << "processResponse";\n    if (!response.object) {\n        return;\n    }\n'
          new = old + '    if (auto e = dynamic_cast<td::td_api::error*>(response.object.get())) {\n        ALogger::err(LOG_TAG) << "TDLib error " << e->code_ << ": " << e->message_;\n    }\n'
          if 'TDLib error' in s:
              print('already patched')
          elif old in s:
              open(p, 'w', encoding='utf-8').write(s.replace(old, new, 1))
              print('patched OK')
          else:
              print('ERROR: processResponse pattern not found')
              raise SystemExit(1)
          PY
          grep -n 'TDLib error' -B3 src/telegram/TelegramClientImpl.cpp

      - name: "Patch: auth diagnostics + config reload safety"
        # Diagnosis 2026-10-05: after setAuthenticationPhoneNumber neither the
        # query response (Ok/error) nor updateAuthorizationState(WaitCode) ever
        # surfaces - not even getOption("version") logs its reply. Log every
        # query response and every auth-state update at INFO so the stall point
        # becomes visible. Also: Kuni rewrites config.toml at startup while its
        # own FileWatcher may reload the truncated file -> api_id reads as 0 ->
        # std::exit(-1) kills the process. Reloads must throw (caught, previous
        # config kept) instead of exiting.
        run: |
          set -e
          python3 - <<'PY'
          # 1) log every outgoing query (id + payload, truncated)
          p = 'src/telegram/TelegramClientImpl.cpp'
          s = open(p, encoding='utf-8').read()
          a = '    ALOG_TRACE(LOG_TAG) << "sendQuery " << td::td_api::to_string(f);\n'
          b = a + '    ALogger::info(LOG_TAG) << "sendQuery #" << (mCurrentQueryId + 1) << ": " << td::td_api::to_string(f).substr(0, 300);\n'
          if 'sendQuery #" <<' in s:
              print('diag sendQuery: already patched')
          elif a in s:
              s = s.replace(a, b, 1)
              print('diag sendQuery: patched OK')
          else:
              print('ERROR: sendQuery anchor not found'); raise SystemExit(1)
          # 2) log every query response + every auth-state update
          a = '    if (auto c = mHandlers.contains(response.request_id)) {\n'
          b = ('    if (response.request_id != 0) {\n'
               '        ALogger::info(LOG_TAG) << "query response id=" << response.request_id << ": " << td::td_api::to_string(response.object).substr(0, 400);\n'
               '    } else if (response.object->get_id() == td::td_api::updateAuthorizationState::ID) {\n'
               '        ALogger::info(LOG_TAG) << "auth update: " << td::td_api::to_string(response.object).substr(0, 400);\n'
               '    }\n' + a)
          if 'query response id=' in s:
              print('diag responses: already patched')
          elif a in s:
              s = s.replace(a, b, 1)
              print('diag responses: patched OK')
          else:
              print('ERROR: processResponse anchor not found'); raise SystemExit(1)
          # 3) prove stdin read works (length only, no secret in logs)
          a = '                        std::cin >> params->phone_number_;\n'
          b = a + '                        ALogger::info(LOG_TAG) << "phone entered, length=" << params->phone_number_.length();\n'
          if 'phone entered, length=' in s:
              print('diag phone: already patched')
          elif a in s:
              s = s.replace(a, b, 1)
              print('diag phone: patched OK')
          else:
              print('ERROR: phone anchor not found'); raise SystemExit(1)
          open(p, 'w', encoding='utf-8').write(s)
          # 4) config reload must not kill the process on a torn read
          p = 'src/config.cpp'
          s = open(p, encoding='utf-8').read()
          a = 'static Config load(bool saveBack = false) {'
          b = 'static Config load(bool saveBack = false, bool isReload = false) {'
          if 'bool isReload' in s:
              print('config sig: already patched')
          elif a in s:
              s = s.replace(a, b, 1)
              print('config sig: patched OK')
          else:
              print('ERROR: load() signature not found'); raise SystemExit(1)
          a = '                cfg = load();'
          b = '                cfg = load(false, true);'
          if b in s:
              print('config watcher: already patched')
          elif a in s:
              s = s.replace(a, b, 1)
              print('config watcher: patched OK')
          else:
              print('ERROR: watcher call not found'); raise SystemExit(1)
          a = '                std::exit(-1);'
          n = s.count(a)
          if 'keeping previous config' in s:
              print('config validation: already patched')
          elif n == 3:
              s = s.replace(a, '                if (isReload) { throw AException("config reload read inconsistent data - keeping previous config"); } std::exit(-1);')
              print('config validation: patched OK (3 sites)')
          else:
              print(f'ERROR: expected 3 validation exits, found {n}'); raise SystemExit(1)
          open(p, 'w', encoding='utf-8').write(s)
          PY
          grep -n 'sendQuery #\|query response id=\|auth update:\|phone entered\|isReload\|keeping previous config' src/telegram/TelegramClientImpl.cpp src/config.cpp

      - name: "Patch: TDLib log verbosity"
        # Diagnosis 2026-10-05: server never answers TDLib's auth.sendCode and the
        # connection then vanishes without TDLib noticing (process alive, zero
        # sockets, frozen log). Kuni-side logging is exhausted - need TDLib's own
        # network/query log (connection events, query send/receive, drops).
        run: |
          set -e
          python3 - <<'PY'
          p = 'src/telegram/TelegramClientImpl.cpp'
          s = open(p, encoding='utf-8').read()
          a = 'td::ClientManager::execute(td::td_api::make_object<td::td_api::setLogVerbosityLevel>(1));'
          b = 'td::ClientManager::execute(td::td_api::make_object<td::td_api::setLogVerbosityLevel>(4));'
          if 'setLogVerbosityLevel>(4)' in s:
              print('verbosity: already patched')
          elif a in s:
              s = s.replace(a, b, 1)
              open(p, 'w', encoding='utf-8').write(s)
              print('verbosity: patched OK (1 -> 4)')
          else:
              print('ERROR: verbosity anchor not found'); raise SystemExit(1)
          PY
          grep -n 'setLogVerbosityLevel' src/telegram/TelegramClientImpl.cpp

      - name: "Patch: auth teardown telemetry + getline input"
        # Diagnosis 2026-10-05: run #11 proved sendCode reaches the wire (code arrived
        # in app), but the app destroys its ClientManager ~0.4s after phone input with
        # no shutdown sequence, no reload, no Closed-before-destroy (event table:
        # Tdlib version=0, reload=0, shutdown=0, Created=1/Destroy=1). Add destructor
        # + init logs to identify the destroyer. Also switch stdin reads to getline
        # so no trailing newline stays in the buffer for anyone else to consume.
        run: |
          set -e
          python3 - <<'PY'
          h = 'src/telegram/TelegramClientImpl.h'
          s = open(h, encoding='utf-8').read()
          a = '    TelegramClientImpl();\n'
          b = a + '    ~TelegramClientImpl();\n'
          if '~TelegramClientImpl();' in s:
              print('hdr dtor: already patched')
          elif a in s:
              s = s.replace(a, b, 1)
              open(h, 'w', encoding='utf-8').write(s)
              print('hdr dtor: patched OK')
          else:
              print('ERROR: ctor anchor not found'); raise SystemExit(1)
          p = 'src/telegram/TelegramClientImpl.cpp'
          s = open(p, encoding='utf-8').read()
          a = 'AFuture<ITelegramClient::Object> TelegramClientImpl::sendQuery'
          b = ('TelegramClientImpl::~TelegramClientImpl() {\n'
               '    ALogger::info(LOG_TAG) << "~TelegramClientImpl destroyed";\n'
               '}\n\n' + a)
          if '~TelegramClientImpl destroyed' in s:
              print('dtor log: already patched')
          elif a in s:
              s = s.replace(a, b, 1)
              print('dtor log: patched OK')
          else:
              print('ERROR: sendQuery anchor not found'); raise SystemExit(1)
          a = '    ALOG_TRACE(LOG_TAG) << "initClientManager";\n'
          b = a + '    ALogger::info(LOG_TAG) << "initClientManager: (re)creating ClientManager";\n'
          if 'initClientManager: (re)creating' in s:
              print('init log: already patched')
          elif a in s:
              s = s.replace(a, b, 1)
              print('init log: patched OK')
          else:
              print('ERROR: init anchor not found'); raise SystemExit(1)
          for field in ['phone_number_', 'password_', 'code_']:
              a = 'std::cin >> params->%s;' % field
              b = 'std::getline(std::cin, params->%s);' % field
              if b in s:
                  print('getline %s: already patched' % field)
              elif a in s:
                  s = s.replace(a, b)
                  print('getline %s: patched OK' % field)
              else:
                  print('ERROR: cin anchor not found for %s' % field); raise SystemExit(1)
          open(p, 'w', encoding='utf-8').write(s)
          PY
          grep -n '~TelegramClientImpl\|(re)creating\|std::getline' src/telegram/TelegramClientImpl.h src/telegram/TelegramClientImpl.cpp

      - name: "Patch: keep TelegramClient alive (block-scope lifetime bug)"
        # Root cause 2026-10-05: in main.cpp, `auto telegram` is declared INSIDE
        # `if (config().telegramEnabled) { ... }`. The holder dies at the closing
        # brace; afterwards the ONLY owner is the suspended connect-lambda's capture.
        # The moment the connection is established the lambda completes, the last
        # holder drops, ~TelegramClientImpl runs and tears down TDLib ~0.4s after
        # phone input - every time. Fix: hoist the holder to aui_entry scope.
        run: |
          set -e
          python3 - <<'PYEOF'
          p = 'src/main.cpp'
          s = open(p, encoding='utf-8').read()
          a = '    _<App> app;\n'
          b = ('    _<App> app;\n'
               '    _<TelegramClientImpl> telegram; // outlives aui_entry: block-local holder died at } and killed auth right after connect\n')
          if 'outlives aui_entry' in s:
              print('hoist decl: already patched')
          elif a in s:
              s = s.replace(a, b, 1)
              print('hoist decl: patched OK')
          else:
              print('ERROR: decl anchor not found'); raise SystemExit(1)
          a = '        auto telegram = _new<TelegramClientImpl>();'
          b = '        telegram = _new<TelegramClientImpl>();'
          if b in s:
              print('hoist assign: already patched')
          elif a in s:
              s = s.replace(a, b, 1)
              print('hoist assign: patched OK')
          else:
              print('ERROR: assign anchor not found'); raise SystemExit(1)
          open(p, 'w', encoding='utf-8').write(s)
          PYEOF
          grep -n 'outlives aui_entry\|telegram = _new' src/main.cpp

      - name: "Patch: drop Ollama-only fields for strict providers"
        # makeQueryString hardcodes Ollama extensions use_context/include_sources.
        # Strict OpenAI-compatible providers (groq via omniroute) reject them with
        # 400 "property 'include_sources' is unsupported" and EVERY reply fails.
        run: |
          set -e
          python3 - <<'PYEOF'
          p = 'src/OpenAIChatImpl.cpp'
          s = open(p, encoding='utf-8').read()
          if 'include_sources' in s or 'use_context' in s:
              s = s.replace('        { "use_context", false },\n', '')
              s = s.replace('        { "include_sources", true },\n', '')
              open(p, 'w', encoding='utf-8').write(s)
              print('ollama fields: removed')
          else:
              print('ollama fields: already patched')
          assert 'include_sources' not in s and 'use_context' not in s
          print('verify: clean')
          PYEOF
          grep -n 'use_context\|include_sources' src/OpenAIChatImpl.cpp || echo '(none left)' 

      - name: "Patch: poll unread chats fallback + event logging"
        # Diagnosis 2026-10-06: TDLib updateNewMessage reaches the process (visible
        # in TDLib log) but App/Worker stays silent - no getChat, no LLM query.
        # Direct-message wakeups get lost in some processes (only the 27-min
        # proactive timer gets through, hence hour-long reply delays). Fix: poll
        # unread chats every 3 minutes via the already-working sendNotificationsOnInit
        # path (same pattern as AppBase's proven mWakeupTimer). Also log every
        # incoming message + filter drops so silence is never invisible again.
        # NOTE: patterns use \n escapes on purpose - literal indentation would
        # be stripped by the YAML block scalar and never match.
        run: |
          set -e
          python3 - <<'PYEOF'
          p = 'src/main.cpp'
          s = open(p, encoding='utf-8').read()
          # 1) polling timer in App constructor, right after onEvent wiring.
          # Guarded against overlapping scans (a previous scan may still be in
          # flight when the next tick fires - concurrent getChats/chat walks
          # segfaulted once).
          a = '                mAsync << this->handleTelegramEvent(aui::ptr::alias(event, u));\n            });\n        });\n'
          b = (a + '        // Polling fallback: direct-message wakeups are flaky (see above).\n'
                  '        mPollTimer = _new<ATimer>(3min);\n'
                  '        connect(mPollTimer->fired, [this] {\n'
                  '            mAsync << [this]() -> AFuture<> {\n'
                  '                static bool scanInFlight = false;\n'
                  '                if (scanInFlight) {\n'
                  '                    co_return;\n'
                  '                }\n'
                  '                scanInFlight = true;\n'
                  '                AUI_DEFER { scanInFlight = false; };\n'
                  '                co_await sendNotificationsOnInit();\n'
                  '            }();\n'
                  '        });\n'
                  '        mPollTimer->start();\n')
          if 'mPollTimer' in s:
              print('poll timer: already patched')
          elif a in s:
              s = s.replace(a, b, 1)
              print('poll timer: patched OK')
          else:
              print('ERROR: App ctor anchor not found'); raise SystemExit(1)
          # 2) timer member next to mTelegram
          a = '    _<ITelegramClient> mTelegram;\n'
          b = a + '    _<ATimer> mPollTimer;\n'
          if '    _<ATimer> mPollTimer;\n' in s:
              print('poll member: already patched')
          elif a in s:
              s = s.replace(a, b, 1)
              print('poll member: patched OK')
          else:
              print('ERROR: member anchor not found'); raise SystemExit(1)
          # 3) skip the chat already being processed (avoids double replies)
          a = '            if (chat->unread_count_ == 0) {\n                continue;\n            }\n'
          b = (a + '            if (mCurrentlyOpenedChat && mCurrentlyOpenedChat->chat->id_ == chat->id_) {\n'
                  '                continue; // worker is already handling this chat\n'
                  '            }\n')
          if 'already handling this chat' in s:
              print('poll skip: already patched')
          elif a in s:
              s = s.replace(a, b, 1)
              print('poll skip: patched OK')
          else:
              print('ERROR: sendNotificationsOnInit anchor not found'); raise SystemExit(1)
          # 4) log every incoming message + filter drops (end silent discards)
          a = '            userId = user->user_id_;\n        }\n'
          b = (a + '        ALogger::info(LOG_TAG) << "updateNewMessage: chat=" << u->message_->chat_id_ << " sender=" << userId;\n')
          if 'updateNewMessage: chat=' in s:
              print('event log: already patched')
          elif a in s:
              s = s.replace(a, b, 1)
              print('event log: patched OK')
          else:
              print('ERROR: handler anchor not found'); raise SystemExit(1)
          a = ('        if (!co_await util::isAccessibleFromLockdown(*telegram(), u->message_->chat_id_)) {\n'
               '            co_return;\n'
               '        }\n')
          b = ('        if (!co_await util::isAccessibleFromLockdown(*telegram(), u->message_->chat_id_)) {\n'
               '            ALogger::info(LOG_TAG) << "updateNewMessage ignored by lockdown filter";\n'
               '            co_return;\n'
               '        }\n')
          if 'ignored by lockdown filter' in s:
              print('lockdown log: already patched')
          elif a in s:
              # matches only handleTelegramEvent's lockdown check (bare co_return)
              s = s.replace(a, b)
              print('lockdown log: patched OK')
          else:
              print('ERROR: lockdown anchor not found'); raise SystemExit(1)
          a = ('        if (!co_await util::isAccessibleFromLockdown(*telegram(), u->message_->chat_id_, config().chatNotificationFilter)) {\n'
               '            co_return;\n'
               '        }\n')
          b = ('        if (!co_await util::isAccessibleFromLockdown(*telegram(), u->message_->chat_id_, config().chatNotificationFilter)) {\n'
               '            ALogger::info(LOG_TAG) << "updateNewMessage ignored by chat_notification_filter";\n'
               '            co_return;\n'
               '        }\n')
          if 'ignored by chat_notification_filter' in s:
              print('notif-filter log: already patched')
          elif a in s:
              s = s.replace(a, b, 1)
              print('notif-filter log: patched OK')
          else:
              print('ERROR: notif-filter anchor not found'); raise SystemExit(1)
          open(p, 'w', encoding='utf-8').write(s)
          PYEOF
          grep -n 'mPollTimer\|already handling this chat\|updateNewMessage: chat=\|ignored by lockdown filter' src/main.cpp

      - name: "Patch: forward build-time flags to AUI.BOOT deps"
        # AUI.BOOT configures every dependency in a SEPARATE `cmake` process
        # (execute_process), which does NOT inherit our CMake cache. Only the
        # variables listed in aui.boot.cmake - or explicitly marked with
        # auib_mark_var_forwardable - are passed down. Without this, passing
        # -DBUILD_TESTING=OFF / -DTD_INSTALL_SHARED_LIBRARIES=OFF to our own
        # configure is silently dropped and tdlib still builds its ~15 test
        # executables plus libtdjson.so (~30 MB).
        run: |
          set -e
          python3 - <<'PY'
          p = 'CMakeLists.txt'
          s = open(p, encoding='utf-8').read()
          anchor = 'set(AUIB_TD_VALIDATE OFF)'
          inject = ('# --- build-time optimization (added during setup) ---\n'
                    'set(BUILD_TESTING OFF)\n'
                    'auib_mark_var_forwardable(BUILD_TESTING)\n'
                    'set(TD_INSTALL_SHARED_LIBRARIES OFF)\n'
                    'auib_mark_var_forwardable(TD_INSTALL_SHARED_LIBRARIES)\n'
                    '# --- end build-time optimization ---\n\n')
          if 'build-time optimization' in s:
              print('already patched')
          elif anchor in s:
              open(p, 'w', encoding='utf-8').write(s.replace(anchor, inject + anchor, 1))
              print('patched OK')
          else:
              print('ERROR: anchor not found')
              raise SystemExit(1)
          PY
          grep -n -A5 'build-time optimization' CMakeLists.txt

      - name: Cache AUI.BOOT deps
        uses: actions/cache@v4
        with:
          path: /root/.aui
          key: aui-boot-deb12-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: |
            aui-boot-deb12-

      - name: Configure CMake
        run: |
          echo "### disk before configure:"; df -h / | tail -1
          cmake -G Ninja -B /work/build \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DAUI_INSTALL_RUNTIME_DEPENDENCIES=TRUE \
            -DAUIB_NO_PRECOMPILED=TRUE
          echo "### cmake cache compiler:"; grep -E 'CMAKE_(CXX_)?COMPILER:' /work/build/CMakeCache.txt
          echo "### AUIB_NO_PRECOMPILED (forces every dep to build from source here):"
          grep -E 'AUIB_NO_PRECOMPILED' /work/build/CMakeCache.txt
          echo "### disk after configure:"; df -h / | tail -1

      - name: Build kuni
        run: |
          echo "### disk before build:"; df -h / | tail -1
          cmake --build /work/build --target kuni -j 4
          echo "### disk after build:"; df -h / | tail -1

      - name: Stage bundle
        # NOTE: no `set -e` here. The ldd/glibc probes below are diagnostics;
        # one flaky pipe must not abort the step. The glibc gate still exits 1
        # explicitly when the binary would not fit Debian 12.
        run: |
          set -u
          mkdir -p /work/bundle
          cp /work/build/bin/kuni /work/bundle/kuni
          chmod +x /work/bundle/kuni
          find /work/build -name '*.so*' -type f ! -path '*/CMakeFiles/*' \
            -exec cp -p {} /work/bundle/ \; 2>/dev/null || true
          # NOTE (2026-10-07): do NOT strip this binary. An unstripped RelWithDebInfo
          # build is required so the next segfault yields a symbolicated backtrace
          # via gdb attach (the app's own SignalHandler swallows SIGSEGV with
          # exit(255), so no coredump is ever written; and a stripped binary
          # would only print ?? frames). Yes, the artifact is bigger - that's fine.
          echo "### unstripped binary size:"; du -h /work/bundle/kuni

          # Hard gate: the server is Debian 12, whose newest symbol version is
          # GLIBC_2.36 (2.36-9+deb12u14 exposes no 2.36.x). AUI.BOOT's
          # precompiled packages come from ubuntu-latest (glibc 2.39), so one
          # stray precompiled .a would silently raise our floor to 2.38+.
          # Compare major.minor only - a patch-level suffix must not false-trigger.
          MAXGLIBC=$(objdump -T /work/bundle/kuni | grep -o 'GLIBC_[0-9][0-9.]*' | sort -Vu | tail -1 || true)
          VER=${MAXGLIBC#GLIBC_}
          MM=$(printf '%s' "$VER" | cut -d. -f1,2)
          HIGHEST=$(printf '%s\n%s\n' "${MM:-none}" 2.36 | sort -V | tail -1)
          echo "### binary needs ${MM:-?} (max symbol $MAXGLIBC); server floor is 2.36"
          if [ "$HIGHEST" != "2.36" ]; then
            echo "ERROR: kuni needs glibc ${MM}, newer than Debian 12 (2.36) - it would not start on the server"
            exit 1
          fi
          echo "### glibc gate: OK (fits Debian 12)"

          # Record exactly what the server must provide.
          {
            echo "### ldd:"
            ldd /work/bundle/kuni 2>/dev/null || true
            echo
            echo "### MISSING (apt-get install these):"
            ldd /work/bundle/kuni 2>/dev/null | grep -i 'not found' || echo "(none)"
            echo
            echo "### max glibc symbol required:"
            objdump -T /work/bundle/kuni | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -1 || true
            echo "### build container glibc:"
            ldd --version 2>/dev/null | sed -n '1p'
          } > /work/bundle/ldd.txt
          cat /work/bundle/ldd.txt

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: kuni-debian12
          path: /work/bundle/
          retention-days: 30
