name: Build Linux (Debian 12 container)

# Build inside a debian:12 container so glibc matches the target server exactly
# (Debian 12 / glibc 2.36). ubuntu-latest gives glibc 2.39, and a binary built
# there dies on Debian 12 with "GLIBC_2.38 not found".

on:
  workflow_dispatch:
  push:
    branches: [ master ]

permissions:
  contents: read

concurrency:
  group: kuni-linux-build
  cancel-in-progress: true

jobs:
  build:
    name: kuni-linux-x86_64
    runs-on: ubuntu-latest
    container:
      image: debian:12

    env:
      DEBIAN_FRONTEND: noninteractive
      GIT_SUBMODULE_STRATEGY: recursive

    steps:
      - name: Install build deps
        # Must come first: debian:12 ships neither git, python3 nor cmake,
        # and every later step needs them.
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl wget gnupg lsb-release git \
            python3 ca-certificates \
            build-essential cmake ninja-build pkg-config gperf \
            zlib1g-dev libssl-dev libcrypt-dev \
            libcurl4-openssl-dev libglew-dev libdbus-1-dev \
            libfontconfig-dev libpulse-dev \
            libgtk-4-dev libadwaita-1-dev \
            binutils file

      - name: Install Clang 22
        run: |
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          /tmp/llvm.sh 22 all
          echo "CC=clang-22"    >> $GITHUB_ENV
          echo "CXX=clang++-22" >> $GITHUB_ENV
          clang-22 --version

      - name: Fetch sources
        uses: actions/checkout@v4

      - name: Patch image_url to OpenAI spec
        # Kuni emits {"type":"image_url","image_url":"<data-url>"} - a bare string.
        # OpenAI-compatible gateways drop the image in that form and the model
        # replies "I can't see the image". Spec requires {"url": "<data-url>"}:
        #   AJson::Object{{"type","image_url"},{"image_url", body}}
        # Without this, capabilities.vision is broken end to end.
        run: |
          set -e
          python3 - <<'PY'
          p = 'src/IOpenAIChat.cpp'
          s = open(p, encoding='utf-8').read()
          old = 'AJson::Object{{"type", "image_url"}, {"image_url", body}}'
          new = 'AJson::Object{{"type", "image_url"}, {"image_url", AJson::Object{{"url", std::string(body)}}}}'
          if new in s:
              print('already patched')
          elif old in s:
              open(p, 'w', encoding='utf-8').write(s.replace(old, new))
              print('patched OK')
          else:
              print('ERROR: pattern not found - upstream changed IOpenAIChat.cpp')
              raise SystemExit(1)
          PY
          grep -n 'image_url' src/IOpenAIChat.cpp

      - name: Cache AUI.BOOT deps
        uses: actions/cache@v4
        with:
          path: /root/.aui
          key: aui-boot-deb12-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: |
            aui-boot-deb12-

      - name: Configure CMake
        run: |
          cmake -G Ninja -B /work/build \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DAUI_INSTALL_RUNTIME_DEPENDENCIES=TRUE

      - name: Build kuni
        run: cmake --build /work/build --target kuni -j 4

      - name: Stage bundle
        run: |
          set -e
          mkdir -p /work/bundle
          cp /work/build/bin/kuni /work/bundle/kuni
          chmod +x /work/bundle/kuni

          # Ship the runtime .so files AUI built/installed, so the binary can run
          # even if the server lacks a matching distro package.
          find /work/build -name '*.so*' -type f \
            ! -path '*/CMakeFiles/*' -exec cp -p {} /work/bundle/ \; 2>/dev/null || true

          strip --strip-unneeded /work/bundle/kuni
          strip --strip-unneeded /work/bundle/*.so* 2>/dev/null || true

          # Record what the server will need to apt-get install.
          ldd /work/bundle/kuni > /work/bundle/ldd.txt 2>&1 || true
          { echo "### missing (must apt-get install):"; grep -i 'not found' /work/bundle/ldd.txt || echo "(none)"; } >> /work/bundle/ldd.txt
          echo "### max glibc symbol required:" >> /work/bundle/ldd.txt
          objdump -T /work/bundle/kuni | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -1 >> /work/bundle/ldd.txt

          echo "=== bundle ==="
          ls -la /work/bundle/
          echo "=== ldd ==="
          cat /work/bundle/ldd.txt
          echo "=== glibc of this container ==="
          ldd --version | head -1

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: kuni-debian12
          path: /work/bundle/
          retention-days: 30
